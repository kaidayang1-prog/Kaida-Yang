/* ---------- Fare split: pure function (same algorithm as the planned src/lib/fare/splitFare.ts) ---------- */
function splitFare({ fuelLPer100km, gasPricePerL, legs }) {
  if (fuelLPer100km < 3 || fuelLPer100km > 25) throw new Error("fuel out of range");
  if (gasPricePerL < 0.5 || gasPricePerL > 3.5) throw new Error("gas price out of range");
  const costPerKm = fuelLPer100km / 100 * gasPricePerL;
  const exact = {}; let totalExact = 0;
  const legsOut = legs.map(l => {
    if (l.km < 0 || !l.riders.length) throw new Error("bad leg");
    const cost = l.km * costPerKm; totalExact += cost;
    const per = cost / l.riders.length;
    l.riders.forEach(r => { exact[r] = (exact[r] || 0) + per * 100; });
    return { km: l.km, cost, riders: l.riders, per };
  });
  const totalCents = Math.round(totalExact * 100 + 1e-9);
  const ids = Object.keys(exact);
  const shares = {}; let floorSum = 0;
  ids.forEach(id => { shares[id] = Math.floor(exact[id] + 1e-9); floorSum += shares[id]; });
  let rest = totalCents - floorSum;
  const order = ids.slice().sort((a, b) => ((exact[b] - Math.floor(exact[b] + 1e-9)) - (exact[a] - Math.floor(exact[a] + 1e-9))) || a.localeCompare(b));
  for (let i = 0; rest > 0; i = (i + 1) % order.length, rest--) shares[order[i]] += 1;
  return { costPerKm, totalCents, shares, exact, legs: legsOut };
}

function hav(a, b) { const R = 6371, r = x => x * Math.PI / 180; const dLat = r(b.lat - a.lat), dLng = r(b.lng - a.lng);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dLng / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(h)); }
function toast(msg) { S.toast = msg; render(); clearTimeout(toast.t); toast.t = setTimeout(() => { S.toast = ""; render(); }, 2200); }

  return L(`${+m}月${+dd}日 周${zw}`, `${ew}, ${["","Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][+m]} ${+dd}`); };

/* ---------- route model for trip t1 ---------- */
function stopInfo(key, trip) {
  if (key === "o") return { label: place("p_lily"), kind: "origin" };
  if (key === "ret") return { label: place("p_lily"), kind: "return" };
  if (key === "dest") return { label: place("p_costco"), kind: "dest" };
  const [k, who] = key.split(":"); const b = S.bookings.find(x => x.trip === trip && x.who === who);
  return { label: place(b.pickup), kind: k === "pk" ? "pickup" : "dropoff", who };
}
function routeModel(tripId) {
  const trip = tripById(tripId); const keys = S.route[tripId]; const drv = S.drivers[trip.driver];
  const legs = [];
  for (let i = 0; i < keys.length - 1; i++) {
    const a = keys[i], b = keys[i + 1], key = a + "|" + b;
    const riders = [trip.driver];
    keys.forEach((k, j) => { if (k.startsWith("pk:")) { const w = k.slice(3); const d = keys.indexOf("dr:" + w); if (j <= i && d > i) riders.push(w); } });
    const manual = S.manualKm[key];
    let km = manual != null ? manual : KNOWN_KM[key];
    if (km == null) km = Math.round(hav(stopInfo(a, tripId).label, stopInfo(b, tripId).label) * 1.3 * 10) / 10;
    legs.push({ key, from: a, to: b, km, manual: manual != null, riders });
  }
  const fare = splitFare({ fuelLPer100km: drv.fuel, gasPricePerL: trip.gas, legs });
  return { trip, keys, legs, fare, drv };
}
function syncBill() {
  const { fare } = routeModel("t1");
  S.bill.forEach(l => { if (l.kind === "fuel") l.cents = fare.shares[l.payer] || 0; });
}

}

function viewAdmin() {
  if (S.persona !== "admin") return `<div class="card">${L("只有管理员可以进入。", "Admins only.")} <button class="btn sm primary" data-act="persona" data-p="admin">${L("切到管理员", "Be admin")}</button></div>`;
  const typeName = k => T(HELP_TYPES.find(h => h.k === k));
  return `<div class="card"><h2>${L("车主认证审核", "Driver verification")}</h2><div class="list">${S.verifications.map(v => `<div class="row wrap"><div class="grow"><b>${name(v.who)}</b> <span class="pill">${v.tier === "full" ? L("完整级", "Full") : L("邻居级", "Neighbour")}</span><div class="xs muted">${esc(T(v.sub))}</div></div>
      ${v.status === "pending" ? `<button class="btn sm" data-act="verify" data-v="${v.id}" data-s="rejected">${L("拒绝", "Reject")}</button><button class="btn sm primary" data-act="verify" data-v="${v.id}" data-s="approved">${L("通过", "Approve")}</button>` : `<span class="pill ${v.status === "approved" ? "good" : "bad"}">${v.status === "approved" ? L("已通过", "Approved") : L("已拒绝", "Rejected")}</span>`}</div>`).join("")}</div></div>
    <div class="card"><h2>${L("申诉", "Claims")}</h2><div class="list">${S.disputes.map(d => `<div class="row wrap"><div class="grow"><b>${esc(typeName(d.type))}</b> <span class="xs muted">· ${name(d.who)}</span><div class="xs muted">${esc(T(d.text))}</div></div>
      ${d.status === "open" ? `<button class="btn sm" data-act="dispute" data-d="${d.id}" data-s="rejected">${L("驳回", "Dismiss")}</button><button class="btn sm primary" data-act="dispute" data-d="${d.id}" data-s="resolved">${L("裁决", "Resolve")}</button>` : `<span class="pill">${d.status === "resolved" ? L("已裁决", "Resolved") : L("已驳回", "Dismissed")}</span>`}</div>`).join("")}</div>
      <p class="xs muted" style="margin:0">${L("裁决金额会作为一笔“申诉裁决”加进行程账单。", "Ruling amounts are added to the trip bill as a dispute line.")}</p></div>
    <div class="card"><h2>${L("账号", "Accounts")}</h2><div class="list">${Object.keys(S.users).map(u => `<div class="row"><span class="grow">${name(u)}</span><span class="pill ${S.users[u] === "suspended" ? "bad" : ""}">${S.users[u] === "suspended" ? L("已暂停", "Suspended") : L("正常", "Active")}</span>
      <button class="btn sm" data-act="suspend" data-u="${u}">${S.users[u] === "suspended" ? L("恢复", "Restore") : L("暂停", "Suspend")}</button></div>`).join("")}</div></div>`;
}

/* ---------- shell ---------- */
function route() {
  const h = (location.hash || "#discover").slice(1);
  const [page, arg] = [h.split("-")[0], h.split("-").slice(1).join("-")];
  return { page, arg };
}
const TITLES = {
  discover: ["发现班次", "Find a trip"], trip: ["班次详情", "Trip"], route: ["路线与油费", "Route & costs"], board: ["上车", "Boarding"],
  chat: ["行程群聊", "Trip chat"], errands: ["代买", "Errands"], bill: ["账单", "Bill"], rate: ["评分", "Rate"], trips: ["我的行程", "My trips"],
  drive: ["车主中心", "Driver"], post: ["发班次", "Post a trip"], vehicle: ["车辆档案", "Vehicle"], inbox: ["消息", "Inbox"], me: ["我", "Me"],
  help: ["帮助与申诉", "Help & claims"], admin: ["管理后台", "Admin"]
};
const TOP = ["discover", "trips", "drive", "inbox", "me"];
function render() {
  const { page, arg } = route();
  const views = { discover: viewDiscover, trip: () => viewTrip(arg), route: () => viewRoute(arg), board: () => viewBoard(arg), chat: () => viewChat(arg),
    errands: () => viewErrands(arg), bill: () => viewBill(arg), rate: () => viewRate(arg), trips: viewTrips, drive: viewDrive, post: viewPost,
    vehicle: viewVehicle, inbox: viewInbox, me: viewMe, help: viewHelp, admin: viewAdmin };
  const v = views[page] || viewDiscover; const tt = TITLES[page] || TITLES.discover;
  const tabOf = { trip: "discover", route: "trips", board: "trips", chat: "trips", errands: "trips", bill: "trips", rate: "trips", post: "drive", vehicle: "drive", help: "me", admin: "me" }[page] || page;
  const unread = S.notifications.filter(n => n.unread).length;
  const focusId = document.activeElement && document.activeElement.id; const selStart = document.activeElement && document.activeElement.selectionStart;
  document.getElementById("app").innerHTML = `
    <header class="top">${TOP.includes(page) ? "" : `<button class="back" data-act="back" aria-label="${L("返回", "Back")}">‹</button>`}<h1>${L(tt[0], tt[1])}</h1>
      <select class="persona" id="persona" data-input="persona" aria-label="${L("演示身份", "Demo persona")}">
        <option value="amy" ${S.persona === "amy" ? "selected" : ""}>${L("乘客 Amy", "Rider Amy")}</option>
        <option value="lily" ${S.persona === "lily" ? "selected" : ""}>${L("车主 Lily", "Driver Lily")}</option>
        <option value="admin" ${S.persona === "admin" ? "selected" : ""}>${L("管理员", "Admin")}</option></select>
      <button class="lang" data-act="lang" data-v="${S.lang === "zh" ? "en" : "zh"}">${S.lang === "zh" ? "EN" : "中"}</button></header>
    <main>${v()}</main>
    <nav class="tabs"><div class="inner">${[["discover", I.search, "发现", "Discover"], ["trips", I.trips, "我的行程", "Trips"], ["drive", I.car, "开车", "Drive"], ["inbox", I.bell, "消息", "Inbox"], ["me", I.me, "我", "Me"]]
      .map(([k, ic, zh, en]) => `<a href="#${k}" class="${tabOf === k ? "on" : ""}">${ic}<span>${L(zh, en)}</span>${k === "inbox" && unread ? `<span class="dot">${unread}</span>` : ""}</a>`).join("")}</div></nav>`;
  document.getElementById("layer").innerHTML = (S.modal ? modalHtml() : "") + (S.toast ? `<div class="toast" role="status">${esc(S.toast)}</div>` : "");
  document.documentElement.lang = S.lang === "zh" ? "zh-CN" : "en";
  if (focusId) { const el = document.getElementById(focusId); if (el) { el.focus(); try { if (selStart != null) el.setSelectionRange(selStart, selStart); } catch (e) {} } }
}
function modalHtml() {
  if (S.modal === "sos") return `<div class="modal-bg"><div class="modal" role="dialog" aria-modal="true"><h2>${L("确认拨打 911？", "Call 911?")}</h2>
    <p class="small muted" style="margin:0">${L("只在紧急情况下使用。拨打后会把你的行程信息发给车上其他人。", "Only for emergencies. Your trip details will be shared with others in the car.")}</p>
    <a class="btn danger" href="tel:911">${L("拨打 911", "Call 911")}</a><p class="xs muted" style="margin:0;text-align:center">${L("如果没有自动拨号，请手动拨打 911。", "If your phone doesn't dial, call 911 directly.")}</p>
    <button class="btn" data-act="closemodal">${L("取消", "Cancel")}</button></div></div>`;
  if (S.modal === "share") return `<div class="modal-bg"><div class="modal"><h2>${L("分享行程", "Share trip")}</h2>
    <input id="share-url" readonly value="https://carpool.example/s/7fK2qLx9"><p class="xs muted" style="margin:0">${L("对方不用登录就能看到目的地、时间和车辆信息，不显示完整车牌和电话。", "Viewers see destination, time and car, without the full plate or phone numbers.")}</p>
    <button class="btn primary" data-act="copyshare">${L("复制链接", "Copy link")}</button><button class="btn" data-act="closemodal">${L("关闭", "Close")}</button></div></div>`;
  return "";
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act; const d = el.dataset;
  if (el.tagName === "INPUT" && el.type === "checkbox") { /* handled below */ }
  switch (a) {
    case "back": history.length > 1 ? history.back() : (location.hash = "#discover"); return;
    case "lang": S.lang = d.v; break;
    case "persona": S.persona = d.p; S.rating = { stars: 0, tags: {}, clean: 0, cleanTags: {} }; break;
    case "filter": S.filter[d.k] = d.v; break;
    case "seats": S.filter.seats = !S.filter.seats; break;
    case "follow": S.following[d.d] = !S.following[d.d]; toast(S.following[d.d] ? L("已关注，有新班次会通知你", "Following. You'll hear about new trips") : L("已取消关注", "Unfollowed")); return;
    case "join": S.joined[d.trip] = d.place; S.pickupQuery = ""; toast(L("报名已发送", "Request sent")); return;
    case "accept": { const b = S.bookings.find(x => x.id === d.b); const t = tripById(b.trip);
      if (seatsLeft(t).left <= 0) { toast(L("座位已满", "Trip is full")); return; }
      b.status = "accepted"; b.pin = String(1000 + Math.floor(Math.random() * 9000)); b.boarded = false;
      const r = S.route[b.trip]; r.splice(r.indexOf("dest"), 0, "pk:" + b.who); r.splice(r.indexOf("dest") + 1, 0, "dr:" + b.who);
      S.bill.splice(S.bill.filter(l => l.kind === "fuel").length, 0, { id: "l" + Date.now(), kind: "fuel", payer: b.who, payee: "lily", cents: null, status: "unpaid" });
      toast(L(`已接受 ${name(b.who)}，路线已更新`, `Accepted ${name(b.who)}. Route updated`)); return; }
    case "reject": S.bookings.find(x => x.id === d.b).status = "rejected"; break;
    case "move": { const r = S.route.t1; const i = +d.i, j = i + +d.dir; [r[i], r[j]] = [r[j], r[i]]; break; }
    case "resetkm": S.manualKm = {}; break;
    case "board": { const b = S.bookings.find(x => x.id === d.b);
      if ((S.pinInput[b.id] || "") === b.pin) { b.boarded = true; toast(L(`${name(b.who)} 已上车`, `${name(b.who)} is on board`)); } else toast(L("PIN 不对，请再核对一次", "That PIN doesn't match. Check again")); return; }
    case "phrase": S.messages.push({ who: S.persona, text: PHRASES[+d.i] }); break;
    case "sos": S.modal = "sos"; break;
    case "share": S.modal = "share"; break;
    case "closemodal": S.modal = null; break;
    case "copyshare": { const v = "https://carpool.example/s/7fK2qLx9";
      (navigator.clipboard ? navigator.clipboard.writeText(v) : Promise.reject()).then(() => toast(L("已复制", "Copied")), () => { const i = document.getElementById("share-url"); i.select(); toast(L("请长按复制", "Select and copy the link")); }); return; }
    case "claim": S.errand.claimedBy = S.persona; toast(L("已认领，边买边勾选", "Claimed. Tick items as you shop")); return;
    case "check": S.errand.items[+d.i].done = el.checked; break;
    case "paid": S.bill.find(l => l.id === d.l).status = "marked"; toast(L("已通知收款方确认", "Payee asked to confirm")); return;
    case "confirm": S.bill.find(l => l.id === d.l).status = "confirmed"; toast(L("已确认收款", "Marked as received")); return;
    case "star": S.rating[d.k] = +d.n; break;
    case "tag": S.rating.tags[d.i] = !S.rating.tags[d.i]; break;
    case "ctag": S.rating.cleanTags[d.k] = !S.rating.cleanTags[d.k]; break;
    case "submitrate": S.rating = { stars: 0, tags: {}, clean: 0, cleanTags: {} }; toast(L("谢谢，评分已提交", "Thanks, rating submitted")); return;
    case "skip": S.series.s1.skips[d.d] = !S.series.s1.skips[d.d]; break;
    case "savevehicle": toast(L("车辆档案已保存", "Vehicle saved")); return;
    case "verify": S.verifications.find(v => v.id === d.v).status = d.s; break;
    case "dispute": S.disputes.find(x => x.id === d.d).status = d.s; break;
    case "suspend": S.users[d.u] = S.users[d.u] === "suspended" ? "active" : "suspended"; break;
    case "reset": { const lang = S.lang; S = freshState(); S.lang = lang; toast(L("演示数据已重置", "Demo data reset")); return; }
  }
  render();
});
document.addEventListener("input", e => {
  const el = e.target; const k = el.dataset && el.dataset.input; if (!k) return;
  if (k === "pickup") { S.pickupQuery = el.value; render(); }
  else if (k === "km") { const v = parseFloat(el.value); if (!isNaN(v) && v >= 0) { S.manualKm[el.dataset.key] = v; } }
  else if (k === "pin") S.pinInput[el.dataset.b] = el.value.replace(/\D/g, "").slice(0, 4);
  else if (k === "receipt") { S.errand.receipt = el.value; render(); }
  else if (k === "vseats" || k === "vfuel") { S.vehicleForm = S.vehicleForm || { seats: S.drivers.lily.seatsTotal, fuel: S.drivers.lily.fuel };
    S.vehicleForm[k === "vseats" ? "seats" : "fuel"] = parseFloat(el.value); render(); }
  else if (k === "helpest") S.helpEstimate = el.value;
});
document.addEventListener("change", e => {
  const el = e.target; const k = el.dataset && el.dataset.input; if (!k) return;
  if (k === "km") render();
  else if (k === "persona") { S.persona = el.value; S.rating = { stars: 0, tags: {}, clean: 0, cleanTags: {} }; render(); }
  else if (k === "helptype") { S.helpType = el.value; render(); }
  else if (k === "helpphoto") S.helpPhotos = el.files.length;
});
document.addEventListener("submit", e => {
  e.preventDefault(); const f = e.target.dataset.form;
  if (f === "chat") { const v = e.target.msg.value.trim(); if (v) { S.messages.push({ who: S.persona, text: { zh: v, en: v } }); render(); } }
  if (f === "post") { const gas = parseFloat(document.getElementById("pf-gas").value); const err = document.getElementById("post-err");
    if (!(gas >= 0.5 && gas <= 3.5)) { err.textContent = L("油价需在 $0.50–3.50/L 之间", "Gas price must be $0.50–3.50/L"); err.hidden = false; return; }
    toast(L("已发布，关注你的人会收到通知", "Posted. Your followers have been notified")); location.hash = "#drive"; }
  if (f === "help") { const err = document.getElementById("help-err"); let msg = "";
    if (!S.helpType) msg = L("请选择问题类型", "Choose what happened");
    else if (S.helpType === "soiled_vehicle" && !S.helpPhotos) msg = L("弄脏车辆需要至少 1 张照片", "Add at least one photo of the mess");
    else if (S.helpType === "vehicle_damage" && (!S.helpPhotos || !(parseFloat(S.helpEstimate) > 0))) msg = L("车辆损坏需要照片和维修估价", "Add a photo and a repair estimate");
    if (msg) { err.textContent = msg; err.hidden = false; return; }
    S.helpType = ""; S.helpPhotos = 0; S.helpEstimate = ""; toast(L("已提交，我们会在 24 小时内回复", "Submitted. We'll reply within 24 hours")); }
});
window.addEventListener("hashchange", () => { S.modal = null; render(); window.scrollTo(0, 0); });
render();
</script>
